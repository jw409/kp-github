name: Build Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  RUST_MIN_STACK: 16777216

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            dir: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          toolchain: 1.99.0

      - name: Build
        run: python3 scripts/binary_provenance.py build --target ${{ matrix.target }} --output target/${{ matrix.target }}/release/kp-github-mcp

      - name: Smoke the native artifact
        run: |
          python3 tests/smoke_consumer.py --binary target/${{ matrix.target }}/release/kp-github-mcp
          python3 tests/smoke_shared_http.py --binary target/${{ matrix.target }}/release/kp-github-mcp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dir }}
          path: target/${{ matrix.target }}/release/kp-github-mcp*

  commit-binaries:
    # Marketplace binaries are published only by an intentional main dispatch.
    # A tag or feature-branch build must never replace main's checked-in binaries.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Commit atop the exact source that produced these artifacts. If main
      # advances during the build, the non-forced push fails instead of rebasing
      # old binaries onto newer source.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Validate source-bound receipts and place binaries
        run: python3 scripts/binary_provenance.py assemble --artifacts artifacts

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bin/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: update verified pre-built binaries"
            git push origin HEAD:main
          fi
